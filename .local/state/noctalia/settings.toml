config_version = 8

[bar.default]
background_opacity = 0.0
end = [ "media", "tray", "group:g1" ]
margin_ends = 0
reserve_space = false
smart_auto_hide = true
start = [ "group:g2" ]

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g1"
    members = [ "network", "bluetooth", "volume", "brightness", "battery", "session" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    enabled = true
    fill = "surface_variant"
    id = "g2"
    members = [ "border-left", "workspaces", "border_right" ]
    opacity = 1.0
    padding = 8.0
    radius = 7.0

[battery]
warning_threshold = 40

[desktop_widgets]
enabled = false

[dock]
background_opacity = 0.26999999396502972
enabled = true
icon_size = 34
launcher_custom_image_colorize = true
launcher_icon = "hand-little-finger"
launcher_position = "start"
pinned = [ "Chromium-browser", "Kitty", "Files", "code" ]
position = "left"
reserve_space = false
show_dots = true
smart_auto_hide = true

[idle]
behavior_order = [ "lock-and-suspend" ]

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 180.0

[location]
address = "Varanasi"

[lockscreen]
fingerprint = false

[lockscreen_widgets]
enabled = false
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 720.0
    cy = 718.0
    output = "eDP-1"
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

[notification]
background_opacity = 0.65999998524785042
border = false

[osd]
border = false

    [osd.kinds]
    media = false

[shell]
avatar_path = "/home/bunesakk/Pictures/arnav.jpeg"
clipboard_history_max_entries = 20
password_style = "random"
polkit_agent = true

    [shell.launcher]
    categories = false
    compact = true
    sort_by_usage = false

    [shell.panel]
    borders = false
    control_center_placement = "floating"
    control_center_position = "center"
    session_placement = "floating"
    session_position = "center"
    transparency_mode = "glass"
    wallpaper_placement = "floating"
    wallpaper_position = "center"

    [shell.session]
    grid = true

[theme]
community_palette = "Lilac AMOLED"
pure_black_dark = true
source = "community"
wallpaper_scheme = "m3-monochrome"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "kcolorscheme", "kitty", "qt" ]
    community_ids = [ "vscode", "fastfetch" ]

[wallpaper]
directory = "/home/bunesakk/Pictures/Wallpapers"

    [wallpaper.default]
    path = "/home/bunesakk/Pictures/Wallpapers/fish_2.jpg"

    [wallpaper.last]
    path = "/home/bunesakk/Pictures/Wallpapers/fish_2.jpg"

    [wallpaper.monitors.eDP-1]
    path = "/home/bunesakk/Pictures/Wallpapers/fish_2.jpg"

[widget.battery]
display_mode = "none"

[widget.border-left]
color = "primary"
text = "[|"
type = "text"

    [widget.border-left.actions]
    left = "caffeine-enable"

[widget.border_right]
color = "primary"
text = "|]"
type = "text"

    [widget.border_right.actions]
    left = "caffeine-disable"

[widget.brightness]
show_label = false

[widget.clock]
capsule = true
capsule_radius = 8
scale = 1.05

[widget.media]
album_art_only = true
hide_when_no_media = true

[widget.network]
show_label = false

[widget.session]
glyph = "app-window"

[widget.tray]
drawer = true
match_adjacent_spacing = true

[widget.volume]
glyph = "letter-v"
show_label = false

[widget.workspaces]
style = "minimal"